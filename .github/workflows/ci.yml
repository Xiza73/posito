name: CI

on:
  pull_request:
  push:
    branches: [dev, master]

# Un push nuevo a la misma rama cancela la corrida anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Mínimo privilegio: el CI solo lee el código
permissions:
  contents: read

jobs:
  checks:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions fijadas por SHA (un tag se puede mover; un SHA no)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # Cada suite de DB levanta un PGlite y aplica todas las migraciones: con pocos núcleos,
      # demasiados workers en paralelo compiten y superan los timeouts.
      - name: Tests
        run: bun run test --maxWorkers=2

      # Valores de relleno, NO secretos: el build no se conecta a la DB (las páginas son
      # dinámicas por la sesión), pero los módulos de auth/db esperan las variables.
      - name: Build
        run: bun run build
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-used-in-prod-0000
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: '1'
